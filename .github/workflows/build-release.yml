name: Build Wine packages

on:
  workflow_dispatch:
  push:
    tags:
      - "kreijstal-*"

permissions:
  contents: write

jobs:
  build-arch-pacman:
    name: Arch pacman package
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: archlinux:latest

    steps:
      - name: Install package tools
        run: |
          # The wine-kreijstal-git package pulls lib32-* build deps, which live
          # in the [multilib] repo. It is disabled by default in the archlinux
          # image, so enable it before syncing or makepkg fails with
          # "target not found: lib32-*".
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            base-devel git ccache sudo

      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare makepkg user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/ccache
          key: arch-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            arch-ccache-${{ github.ref_name }}-
            arch-ccache-

      - name: Build pacman package
        working-directory: packaging/aur/wine-kreijstal-git
        run: |
          sudo -u builder ccache --set-config=max_size=5G
          sudo -u builder makepkg --syncdeps --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          sha256sum "$GITHUB_WORKSPACE"/dist/*.pkg.tar.zst > "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          sudo -u builder ccache --show-stats

      - name: Upload pacman package artifact
        uses: actions/upload-artifact@v7
        with:
          name: wine-kreijstal-arch-pacman
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish pacman release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          generate_release_notes: true

  build-linux-wow64:
    name: Linux WoW64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable i386 packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install build dependencies
        run: |
          # The i386 builds of krb5-multidev and libpcap0.8-dev cannot be
          # unpacked on the hosted runner: dpkg-deb aborts every time with
          # "paste subprocess killed by signal (Broken pipe)" (deterministic for
          # these two .debs, while every other i386 package unpacks fine). Wine
          # does not force --with-pcap/--with-krb5, so omit the 32-bit pcap/krb5
          # -dev packages; configure simply disables those for the 32-bit build.
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib ccache flex bison \
            mingw-w64-tools gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 \
            gettext pkg-config fontforge \
            libx11-dev libx11-dev:i386 libxext-dev libxext-dev:i386 \
            libfreetype-dev libfreetype-dev:i386 \
            libfontconfig-dev libfontconfig-dev:i386 \
            libxrender-dev libxrender-dev:i386 \
            libxrandr-dev libxrandr-dev:i386 \
            libxxf86vm-dev libxxf86vm-dev:i386 \
            libxcursor-dev libxcursor-dev:i386 \
            libxi-dev libxi-dev:i386 \
            libxinerama-dev libxinerama-dev:i386 \
            libxcomposite-dev libxcomposite-dev:i386 \
            libxkbregistry-dev libxkbregistry-dev:i386 \
            libwayland-dev libwayland-dev:i386 wayland-protocols \
            libvulkan-dev libvulkan-dev:i386 \
            libasound2-dev libasound2-dev:i386 \
            libpulse-dev libpulse-dev:i386 \
            libdbus-1-dev libdbus-1-dev:i386 \
            libgnutls28-dev libgnutls28-dev:i386 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsdl2-dev libsdl2-dev:i386 \
            libv4l-dev libv4l-dev:i386 \
            opencl-headers ocl-icd-opencl-dev ocl-icd-opencl-dev:i386 \
            libpcap-dev \
            libusb-1.0-0-dev libusb-1.0-0-dev:i386 \
            libudev-dev libudev-dev:i386 \
            libkrb5-dev \
            unixodbc-dev unixodbc-dev:i386 \
            libunwind-dev libunwind-dev:i386

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Configure 64-bit Wine
        run: |
          mkdir -p build64
          cd build64
          ../configure \
            --enable-win64 \
            CC="ccache gcc" \
            CXX="ccache g++" \
            x86_64_CC="ccache x86_64-w64-mingw32-gcc" \
            --with-x \
            --with-gstreamer \
            --with-alsa \
            --with-pulse \
            --with-dbus \
            --without-cups \
            --without-sane \
            --without-gphoto \
            --with-v4l2 \
            --with-vulkan \
            --with-sdl \
            --with-opencl

      - name: Build 64-bit Wine
        run: make -C build64 -j"$(nproc)"

      - name: Configure 32-bit Wine
        run: |
          mkdir -p build32
          cd build32
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig \
          ../configure \
            --with-wine64=../build64 \
            CC="ccache gcc -m32" \
            CXX="ccache g++ -m32" \
            i386_CC="ccache i686-w64-mingw32-gcc" \
            --with-x \
            --without-gstreamer \
            --with-alsa \
            --with-pulse \
            --with-dbus \
            --without-cups \
            --without-sane \
            --without-gphoto \
            --with-v4l2 \
            --with-vulkan \
            --with-sdl \
            --with-opencl

      - name: Build 32-bit Wine
        run: make -C build32 -j"$(nproc)"

      - name: Install into package root
        run: |
          rm -rf package-root
          mkdir -p package-root
          make -C build64 install DESTDIR="$PWD/package-root"
          make -C build32 install DESTDIR="$PWD/package-root"

      - name: Package artifact
        run: |
          short_sha="${GITHUB_SHA::12}"
          name="wine-kreijstal-${GITHUB_REF_NAME}-${short_sha}-linux-wow64"
          mkdir -p dist
          tar -C package-root -cJf "dist/${name}.tar.xz" .
          sha256sum "dist/${name}.tar.xz" > "dist/${name}.tar.xz.sha256"
          ccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wine-kreijstal-linux-wow64
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.xz
            dist/*.sha256
          generate_release_notes: true
